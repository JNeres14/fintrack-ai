spring.application.name=fintrack-backend

# Sem perfil explícito, o padrão é dev. Os testes ativam "test" pelo Surefire (pom.xml).
spring.profiles.default=dev

# Lê o .env da raiz do repositório (o Maven roda a partir de backend/). Opcional: variáveis de
# ambiente do sistema também funcionam e têm prioridade. Atenção: formato .properties, então
# barra invertida (\) em valores precisa ser escrita como \\.
spring.config.import=optional:file:../.env[.properties]

# Conexão (sem valor padrão: se faltar variável, a aplicação não sobe)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# O schema só muda por migração Flyway; o Hibernate apenas confere se as entidades batem.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.clean-disabled=true

# Segurança (Bloco B, ADR-010 a ADR-014)
# JWT_SECRET não tem valor padrão: ausente, vazio ou com menos de 32 bytes, a aplicação não sobe.
app.jwt.secret=${JWT_SECRET}
app.jwt.access-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:15}
app.jwt.refresh-ttl-days=${JWT_REFRESH_TTL_DAYS:7}
app.auth.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
app.auth.lock-minutes=${AUTH_LOCK_MINUTES:15}
app.auth.rate-limit-per-minute=${AUTH_RATE_LIMIT_PER_MINUTE:10}
app.auth.bcrypt-cost=12
# Vazio = nenhuma origem liberada (fechado por padrão). Lista separada por vírgula, sem curinga.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Actuator: só o /health (sem detalhes) fica exposto.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Fuso da data de negócio (decide quando a fatura do cartão fecha). Só o dia muda; o resto fica em UTC.
app.timezone=${APP_TIMEZONE:America/Sao_Paulo}

# OpenAPI/Swagger UI: desligados em todo perfil; só o dev os liga (application-dev.properties). ADR-019.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
