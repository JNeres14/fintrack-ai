# Perfil de teste: usa SOMENTE DB_TEST_URL (banco fintrack_test), nunca DB_URL.
# A classe TestDatabaseGuard confere o nome do banco antes de qualquer clean.
spring.datasource.url=${DB_TEST_URL}
spring.flyway.clean-disabled=false

# Segurança nos testes: chave FIXA e SÓ de teste (não é segredo real; existe apenas neste arquivo de src/test).
app.jwt.secret=chave-somente-de-teste-nao-usar-em-producao-0123456789
app.auth.bcrypt-cost=4
app.auth.rate-limit-per-minute=1000
app.cors.allowed-origins=http://localhost:5173
